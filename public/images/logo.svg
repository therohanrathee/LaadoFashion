  <circle cx="250" cy="250" r="200" fill="none" stroke="#C5A55A" stroke-width="8"/>
  <circle cx="250" cy="250" r="185" fill="none" stroke="#C5A55A" stroke-width="2" stroke-dasharray="10 10"/>
  <!-- Needle -->
  <path d="M 230 150 L 240 370 L 250 150 Z" fill="#E91E63"/>
  <circle cx="240" cy="170" r="3" fill="#0a0a0a"/>
