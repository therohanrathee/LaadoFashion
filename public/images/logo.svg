<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Ultra-Premium Gold Gradient -->
    <linearGradient id="gold" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C59B3C" />
      <stop offset="25%" stop-color="#FDF3CB" />
      <stop offset="50%" stop-color="#D6AD4A" />
      <stop offset="75%" stop-color="#F9E29D" />
      <stop offset="100%" stop-color="#A67B27" />
    </linearGradient>
  </defs>

  <g transform="translate(50, 40)">
    <!-- Custom Elegant Serif L -->
    <path d="
      M 90,50 
      C 105,50 110,55 110,70 
      L 110,240 
      C 110,265 125,270 150,270 
      L 230,270 
      C 245,270 250,260 250,245 
      L 265,245 
      C 260,285 230,290 200,290 
      L 90,290 
      C 60,290 55,280 55,260 
      L 70,260 
      C 70,270 75,275 90,275 
      L 90,70 
      C 90,55 80,50 65,50 
      L 65,35
      C 80,35 90,40 90,50
      Z" 
      fill="url(#gold)" />
      
    <!-- The Needle (Right side of L, perfectly balanced) -->
    <!-- Positioned at x=240, from y=15 to y=310 -->
    <path d="
      M 240,15
      C 234,15 234,45 236,70
      L 238,270
      L 240,310
      L 242,270
      L 244,70
      C 246,45 246,15 240,15
      Z
      M 240,25
      C 242,25 242,55 240,55
      C 238,55 238,25 240,25
      Z" 
      fill="url(#gold)" fill-rule="evenodd" />
  </g>
</svg>
